
name: Android build

on:
  workflow_dispatch:
    inputs:
      run_instrumented_tests:
        description: "Executar testes instrumentados no emulador"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compilar SAM TV OFICIAL
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK não encontrado no ambiente."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK/cmdline-tools"
            find "$SDK" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK encontrado: $SDK"
          "$SDKMANAGER" --version

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Verificar Gradle
        run: ./gradlew --version

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Compilar APK de release
        run: ./gradlew assembleRelease --stacktrace

      - name: Executar testes instrumentados
        if: ${{ inputs.run_instrumented_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          script: ./gradlew connectedDebugAndroidTest

      - name: Publicar APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samtv-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
