
name: Android build

on:
  workflow_dispatch:
    inputs:
      run_instrumented_tests:
        description: "Executar testes instrumentados no emulador"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compilar SAM TV OFICIAL
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug

      - name: Compilar APK de release
        run: ./gradlew assembleRelease

      - name: Executar testes instrumentados
        if: ${{ inputs.run_instrumented_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          script: ./gradlew connectedDebugAndroidTest

      - name: Publicar APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samtv-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
